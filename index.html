@keyframes breathe{0%,100%{transform:scale(.86);opacity:.6}50%{transform:scale(1.08);opacity:1}}@keyframes orbit{to{transform:rotate(336deg)}}@keyframes orbitTwo{to{transform:rotate(-292deg)}}@keyframes dot{50%{transform:scale(2);opacity:.45}}@keyframes coreFloat{0%,100%{transform:translate3d(0,3px,80px) rotateX(0)}50%{transform:translate3d(0,-12px,80px) rotateX(7deg)}}@keyframes coreSpin{to{transform:rotate(360deg)}}@keyframes irisPulse{0%,100%{transform:scale(.87)}50%{transform:scale(1.08)}}@keyframes irisRing{50%{transform:rotate(180deg) scale(1.14);opacity:.4}}@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}@keyframes scanner{0%,100%{transform:translateY(-39vh);opacity:0}15%{opacity:.7}50%{transform:translateY(39vh);opacity:.45}85%{opacity:.7}}@keyframes markerFloat{0%,100%{transform:translate(0,0) rotate(0)}50%{transform:translate(9px,-13px) rotate(90deg)}}@keyframes titleIn{from{opacity:0;transform:translateY(30px) scale(.96);letter-spacing:-.04em}to{opacity:1;transform:translateY(0) scale(1);letter-spacing:-.095em}}@keyframes ghost{0%,100%{opacity:.6}50%{opacity:.1;transform:translate(10px,3px)}}@keyframes grain{0%{transform:translate(0,0) rotate(7deg)}25%{transform:translate(3%,-2%) rotate(7deg)}50%{transform:translate(-2%,4%) rotate(7deg)}75%{transform:translate(4%,2%) rotate(7deg)}100%{transform:translate(-3%,-4%) rotate(7deg)}}
@media (pointer:coarse), (max-width:600px){.grain{display:none}.halo{filter:none;opacity:.7}.orbit{box-shadow:none}.orbit:before,.orbit:after{box-shadow:none}.core:before,.core:after{box-shadow:none}.iris{box-shadow:0 0 18px 4px rgba(217,255,101,.2),0 0 45px rgba(125,255,177,.08)}.scanner{animation-duration:9s}.frame{inset:15px}.readout{top:31px;left:30px;font-size:8px}.side{right:20px;font-size:7px}.bottom{left:30px;bottom:31px;width:calc(100% - 60px);font-size:7px}.line{margin:0 10px}.orbit{width:90vw;height:32vw}.orbit.two{width:60vw;height:95vw}.orbit.three{width:110vw;height:41vw}.core{min-width:180px;min-height:180px;width:57vw;height:57vw}.marker{transform:scale(.8)}.m1{left:18%;top:26%}.m2{right:15%;top:62%}.m3{left:12%;bottom:25%}.m4{right:10%;bottom:19%}}

<body>
<canvas id="field" aria-hidden="true"></canvas><div class="grain"></div><div class="vignette"></div>
<div class="scene" aria-label="Coming Soon"><div class="halo"></div><div class="orbit"></div><div class="orbit two"></div><div class="orbit three"></div><div class="core"><div class="iris"></div></div><div class="scanner"></div><div class="marker m1"></div><div class="marker m2"></div><div class="marker m3"></div><div class="marker m4"></div><div class="title"><h1>COMING<br>SOON</h1><span class="pulse"></span></div></div>
<div class="ui" aria-hidden="true"><div class="frame"><span class="corner a"></span><span class="corner b"></span></div></div>
<script>
const c=document.getElementById('field'),x=c.getContext('2d',{alpha:true,desynchronized:true}),lowPower=(navigator.hardwareConcurrency&&navigator.hardwareConcurrency<=4)||(navigator.deviceMemory&&navigator.deviceMemory<=4),smallScreen=Math.min(innerWidth,innerHeight)<700,quality=lowPower||smallScreen?0.58:1,dpr=Math.min(devicePixelRatio||1,quality<1?1.25:1.5),mouse={x:innerWidth/2,y:innerHeight/2,tx:innerWidth/2,ty:innerHeight/2},reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;let w,h,t=0,last=0;
const count=quality<1?42:quality<.8?60:84;
const points=Array.from({length:count},(_,i)=>({a:Math.random()*Math.PI*2,r:.12+Math.random()*.48,s:.15+Math.random()*.55,seed:i*8.17}));
function size(){w=innerWidth;h=innerHeight;c.width=Math.floor(w*dpr);c.height=Math.floor(h*dpr);c.style.width=w+'px';c.style.height=h+'px';x.setTransform(dpr,0,0,dpr,0,0)}
function draw(now=0){if(now-last<(quality<1?32:22)){requestAnimationFrame(draw);return}last=now;t+=reduced?.002:quality<1?.004:.007;mouse.x+=(mouse.tx-mouse.x)*.045;mouse.y+=(mouse.ty-mouse.y)*.045;x.clearRect(0,0,w,h);let cx=w/2+(mouse.x-w/2)*.035,cy=h/2+(mouse.y-h/2)*.035;const arr=points.map(p=>{let a=p.a+t*p.s*.25+Math.sin(t+p.seed)*.08,r=p.r*Math.min(w,h),wave=Math.sin(t*1.4+p.seed)*10;return{x:cx+Math.cos(a)*r+wave,y:cy+Math.sin(a)*r*.67+Math.cos(t+p.seed)*10}});
for(let i=0;i<arr.length;i++){for(let j=i+1;j<Math.min(i+5,arr.length);j++){let dx=arr[i].x-arr[j].x,dy=arr[i].y-arr[j].y,dist=Math.hypot(dx,dy);if(dist<125){x.strokeStyle='rgba(178,255,202,'+(0.12-dist/1000)+')';x.lineWidth=.45;x.beginPath();x.moveTo(arr[i].x,arr[i].y);x.lineTo(arr[j].x,arr[j].y);x.stroke()}}}
arr.forEach((p,i)=>{let md=Math.hypot(p.x-mouse.x,p.y-mouse.y),hi=Math.max(0,1-md/(quality<1?210:250));x.fillStyle=hi>.2?'rgba(217,255,101,'+(.35+hi*.65)+')':'rgba(187,255,211,.35)';x.beginPath();x.arc(p.x,p.y,1+hi*2.5,0,Math.PI*2);x.fill();if(i%19===0&&quality>.7){x.strokeStyle='rgba(217,255,101,.18)';x.beginPath();x.arc(p.x,p.y,5+hi*9,0,Math.PI*2);x.stroke()}});requestAnimationFrame(draw)}
addEventListener('resize',size,{passive:true});addEventListener('pointermove',e=>{mouse.tx=e.clientX;mouse.ty=e.clientY},{passive:true});addEventListener('touchmove',e=>{if(e.touches[0]){mouse.tx=e.touches[0].clientX;mouse.ty=e.touches[0].clientY}},{passive:true});size();requestAnimationFrame(draw);
